name: test-review-reciepient
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  policy-exit:
    steps:
      - id: write-input
        name: Write policy input file
        uses: docker://alpine:latest
        shell: sh
        run: |
          cat > /cloudbees/workspace/policy-input.json << 'EOF'
          [{"type":"vulnerability_scan_summary","data":{"summary":{"by_severity":{"total":0,"critical":1,"high":0,"medium":0,"low":0}}}}]
          EOF

      - id: evaluate-policy
        name: Evaluate policy by context
        uses: cloudbees-io/policy-check/actions/evaluate-policy-context@v1
        with:
          input-file: /cloudbees/workspace/policy-input.json
          checkpoint-type: workflow
          checkpoint-position: exit

      - name: Print policy-check outputs
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "action:                 ${{ steps.evaluate-policy.outputs.action }}"
          echo "details:                ${{ steps.evaluate-policy.outputs.details }}"
          echo "review-channel:         ${{ steps.evaluate-policy.outputs.review-channel }}"
          echo "review-recipients:      ${{ steps.evaluate-policy.outputs.review-recipients }}"
          echo "review-timeout-minutes: ${{ steps.evaluate-policy.outputs.review-timeout-minutes }}"
