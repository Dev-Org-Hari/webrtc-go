apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ah-staged-test-gosec
on:
  workflow_dispatch: {}
metadata:
  stages/v1alpha1:
    - name: build
      jobs:
        - compile
    - name: test
      jobs:
        - security-scan
    - name: deploy
      jobs:
        - deploy-staging
jobs:
  compile:
    steps:
      - uses: docker://alpine:3.20
        run: echo "compiling"
  security-scan:
    needs:
      - compile
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - id: gosec-step
        name: Scan with Gosec
        uses: cloudbees-io/gosec-plugin@v1
      - name: Show what the scan found
        uses: docker://alpine:3.20
        run: |
          echo "critical=${{ steps.gosec-step.outputs.critical-count }}"
          echo "high=${{ steps.gosec-step.outputs.high-count }}"
          echo "medium=${{ steps.gosec-step.outputs.medium-count }}"
          echo "low=${{ steps.gosec-step.outputs.low-count }}"
  deploy-staging:
    needs:
      - security-scan
    steps:
      - uses: docker://alpine:3.20
        run: echo "deploying"
