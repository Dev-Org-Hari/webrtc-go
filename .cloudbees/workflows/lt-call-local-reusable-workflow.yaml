apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: lt-call-local-reusable-workflow
on:
  workflow_dispatch: {}
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  generate-subject:
    uses: ./.cloudbees/workflows/rw-subject-generator.yaml
  policy-evaluation:
    needs:
      - generate-subject
    steps:
      - id: nop
        name: Do nothing
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo Done
