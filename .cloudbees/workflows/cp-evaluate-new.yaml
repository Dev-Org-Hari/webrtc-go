name: cp-evaluate-new
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  scan-and-evaluate:
    steps:
      - name: Checkout Source Code
        uses: cloudbees-io/checkout@v2

      - name: Run Gosec Scan
        id: gosec-step
        uses: cloudbees-io/gosec-plugin@v1
  print:
    needs: scan-and-evaluate
    steps:
      - id: print-gosec-outputs
        name: Print gosec outputs
        uses: docker://alpine:latest
        run: |
          echo "Gosec outputs:"
  publish:
    needs: scan-and-evaluate
    steps:
      - name: Publish something
        uses: docker://alpine:latest
        shell: sh
        run: echo "Publishing..."
      - name: Within step
        uses: docker://alpine:latest
        shell: sh
        run: echo "Within..."
      - name: Exit step
        uses: docker://alpine:latest
        shell: sh
        run: echo "exiting..."