# .cloudbees/workflows/shared-test-suite.yaml — the called workflow
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: shared-test-suite

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

jobs:
  run-tests:
    steps:
      - uses: docker://alpine:3.20
        run: echo "running shared tests against ${{ inputs.target }}"