apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ah-staged-test-reusable
on:
  workflow_dispatch: {}
metadata:
  stages/v1alpha1:
    - name: build
      jobs:
        - compile
    - name: test
      jobs:
        - run-shared-tests
    - name: deploy
      jobs:
        - deploy-staging
jobs:
  compile:
    steps:
      - uses: docker://alpine:3.20
        run: echo "compiling"
  run-shared-tests:
    needs:
      - compile
    uses: ./.cloudbees/workflows/shared-test-suite.yaml
    with:
      target: staging
  deploy-staging:
    needs:
      - run-shared-tests
    steps:
      - uses: docker://alpine:3.20
        run: echo "deploying"
