apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: al-prior-approval-with-gate-entry
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: stage1-approve
      jobs:
        - do-work
        - manual-gate
    - name: stage2-gated-work
      jobs:
        - post-approval-step
jobs:
  do-work:
    steps:
      - uses: docker://alpine:latest
        run: echo "Stage 1 work complete"
  manual-gate:
    needs: do-work
    timeout-minutes: 1440
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve to proceed to stage 2 (CBP-58385 entry gate test).
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
      approvers: 1db49f78-4578-11ed-929c-42010a83ae66,e70bcb3e-4a74-11ed-b1a3-42010a83ae66
  post-approval-step:
    needs: manual-gate
    steps:
      - uses: docker://alpine:latest
        run: echo "Reached stage 2 after human approval"
