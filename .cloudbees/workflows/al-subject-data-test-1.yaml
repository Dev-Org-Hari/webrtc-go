name: al-subject-data-test-1
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  scan-job:
    outputs:
      policy-subject: ${{ steps.make-input.outputs.policy-subject }}
    steps:
      - id: make-input
        name: Build valid policy subject
        uses: docker://alpine:latest
        env:
          REPO: ${{ cloudbees.scm.repositoryUrl }}
          COMMIT: ${{ cloudbees.scm.sha }}
        shell: sh
        run: |
          cat > "$CLOUDBEES_OUTPUTS/policy-subject" << EOF
          [{
            "type": "vulnerability_scan",
            "data": {
              "summary": { "by_severity": { "total": 0, "critical": 0, "high": 0, "medium": 0, "low": 0 } }
            },
            "meta": [{
              "tool": "Security Scanner 1", "tool_version": "1.0", "tool_type": "sast_scan",
              "status": "COMPLETE", "scanned_at": "2026-07-16T15:30:43Z",
              "target": { "type": "repository", "commit_sha": "${COMMIT}", "repo": "${REPO}" }
            }]
          }, {
            "type": "sast_scan",
            "data": { "completed": true },
            "meta": [{
              "tool": "Security Scanner 1", "tool_version": "1.0", "tool_type": "sast_scan",
              "status": "COMPLETE", "scanned_at": "2026-07-16T15:30:43Z",
              "target": { "type": "repository", "commit_sha": "${COMMIT}", "repo": "${REPO}" }
            }]
          }]
          EOF

      # Inline within: stores subject data, evaluates immediately
      - name: Inline policy check (within)
        uses: cloudbees-io/policy-utils/evaluate-policy-context/workflow.yml@v2
        with:
          input-data: ${{ steps.make-input.outputs.policy-subject }}
          checkpoint-type: job
          checkpoint-name: scan-job
          checkpoint-position: within

  evaluate-job:
    needs:
      - scan-job
    steps:
      # Boundary exit: NO subject data sent — should use accumulated data from scan-job
      - name: Boundary policy check (exit)
        uses: cloudbees-io/policy-utils/evaluate-policy-context/workflow.yml@v2
        with:
          checkpoint-type: job
          checkpoint-name: evaluate-job
          checkpoint-position: exit