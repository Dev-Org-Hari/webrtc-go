apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test-new-approval-table
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
metadata:
  stages/v1alpha1:
    - name: SAST Scan
      jobs:
        - scan-and-store-new-table
    - name: Policy Gate
      jobs:
        - print-the-subject-data
jobs:
  scan-and-store-new-table:
    outputs:
      policy-subject: ${{ steps.gosec.outputs.policy-subject }}
    steps:
      - name: Checkout source code
        uses: cloudbees-io/checkout@v1

      - name: Run Gosec
        id: gosec
        uses: cloudbees-io/gosec-plugin@v1

      - name: Print Gosec outputs
        uses: docker://alpine:latest
        run: |
          echo "=== Gosec Scan Results ==="
          echo "Critical:       ${{ steps.gosec.outputs.critical-count }}"
          echo "Very High:      ${{ steps.gosec.outputs.very-high-count }}"
          echo "High:           ${{ steps.gosec.outputs.high-count }}"
          echo "Medium:         ${{ steps.gosec.outputs.medium-count }}"
          echo "Low:            ${{ steps.gosec.outputs.low-count }}"
          echo "Policy subject: ${{ steps.gosec.outputs.policy-subject }}"

  print-the-subject-data:
    needs:
      - scan-and-store-new-table
    steps:
      - name: Print policy input
        uses: docker://alpine:latest
        shell: sh
        env:
          ORG: ${{ cloudbees.org.id }}
          ACCESS_KEY: ${{ cloudbees.api.token }}
          URL: ${{ cloudbees.api.url }}
          POLICY_SUBJECT: ${{ needs.scan-and-store-new-table.outputs.policy-subject }}
        run: |
          echo "$URL"
          echo "$ORG"
          echo "Authorization: Bearer $ACCESS_KEY"
          echo "$POLICY_SUBJECT"
